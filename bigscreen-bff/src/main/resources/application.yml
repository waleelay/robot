server:
  # Bigscreen BFF HTTP 服务端口。
  port: ${BIGSCREEN_BFF_PORT:8090}

center:
  # 管理中心服务基础地址。
  manage-base-url: ${CENTER_MANAGE_BASE_URL:http://host.docker.internal:8866}
  # Control Service 基础地址。
  control-base-url: ${CENTER_CONTROL_BASE_URL:http://control-service:8082}
  # 旧版控制服务基础地址。
  v1-control-base-url: ${CENTER_V1_CONTROL_BASE_URL:http://host.docker.internal:8867}
  # Media Service 基础地址。
  media-base-url: ${CENTER_MEDIA_BASE_URL:http://media-service:8088}
  # Control Service WebSocket 地址。
  websocket-control-url: ${CENTER_CONTROL_WS_URL:ws://control-service:8082/ws/control}
  # 现场 App 视频呼叫 WebSocket 地址。
  websocket-field-call-url: ${CENTER_FIELD_CALL_WS_URL:ws://control-service:8082/ws/field-call}

statistics:
  report:
    # 单实例统计报告持久化目录；生产必须挂载独立持久化磁盘。
    storage-dir: ${STATISTICS_REPORT_STORAGE_DIR:data/statistics-reports}
    # 写入新报告后仍需保留的最小磁盘余量，默认 1 GiB。
    minimum-free-bytes: ${STATISTICS_REPORT_MINIMUM_FREE_BYTES:1073741824}
    # 本地存储只允许 1；扩容前必须另行实施共享存储。
    instance-count: ${STATISTICS_REPORT_INSTANCE_COUNT:1}
    # 历史报告过期清理周期。
    cleanup-interval-ms: ${STATISTICS_REPORT_CLEANUP_INTERVAL_MS:3600000}

bigscreen:
  websocket:
    # WebSocket 授权快照最大允许陈旧时间；超过后禁止继续收发业务消息。
    authorization-max-staleness-ms: ${BIGSCREEN_WS_AUTHORIZATION_MAX_STALENESS_MS:300000}
    # Token/快照过期检查周期；Management 权限查询由独立线程按身份执行。
    authorization-check-interval-ms: ${BIGSCREEN_WS_AUTHORIZATION_CHECK_INTERVAL_MS:1000}
    # 单次设备与固定摄像头完整权限加载的总时限。
    authorization-load-timeout-ms: ${BIGSCREEN_WS_AUTHORIZATION_LOAD_TIMEOUT_MS:8000}
    # 初始化等待及会话配额；超额连接以 4008 关闭，不进入持续重连。
    initialization-wait-ms: ${BIGSCREEN_WS_INITIALIZATION_WAIT_MS:15000}
    max-sessions-per-identity: ${BIGSCREEN_WS_MAX_SESSIONS_PER_IDENTITY:8}
    max-sessions-per-organization: ${BIGSCREEN_WS_MAX_SESSIONS_PER_ORGANIZATION:64}
    max-sessions-per-instance: ${BIGSCREEN_WS_MAX_SESSIONS_PER_INSTANCE:64}
  fixed-camera-catalog-lease:
    # 开启后，BFF 在用户固定摄像头授权列表完整查询成功后向 Control 续租。
    enabled: ${FIXED_CAMERA_CATALOG_LEASE_ENABLED:true}
    # 租约过期后 Gateway 停止相应周期探测；代码硬上限为 300 秒。
    duration-seconds: ${FIXED_CAMERA_CATALOG_LEASE_SECONDS:180}
  auth:
    # BFF 校验 JWT audience/authorized party 时使用的客户端 ID。
    client-id: ${BIGSCREEN_AUTH_CLIENT_ID:bigscreen-web}
    # 现场 App 使用独立 Public Client，只允许连接 /ws/field-call。
    field-call-client-id: ${FIELD_CALL_AUTH_CLIENT_ID:field-app}
  cors:
    # 大屏接口允许跨域访问的来源模式，多个值用逗号分隔。
    allowed-origin-patterns: ${BIGSCREEN_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8080,http://127.0.0.1:8080,http://192.168.*.*:8080,https://192.168.*.*:4443}

panorama:
  general:
    # 单个 Overview 会并行读取多个非任务资源；16 足以覆盖一次正常扇出，仍受全局闸门保护。
    connect-timeout-ms: ${PANORAMA_GENERAL_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PANORAMA_GENERAL_READ_TIMEOUT_MS:1500}
    max-concurrency: ${PANORAMA_GENERAL_MAX_CONCURRENCY:16}
  workflow-alarm:
    # 工作流告警初始化与事件刷新独立限流，避免批量重连拖垮通用查询。
    max-concurrency: ${PANORAMA_WORKFLOW_ALARM_MAX_CONCURRENCY:1}
  task:
    # Management 任务接口使用独立短超时和并发闸门，避免慢请求拖垮全景聚合。
    connect-timeout-ms: ${PANORAMA_TASK_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PANORAMA_TASK_READ_TIMEOUT_MS:1500}
    max-concurrency: ${PANORAMA_TASK_MAX_CONCURRENCY:8}

spring:
  application:
    # Spring Boot 应用名称，用于日志、监控和服务标识。
    name: bigscreen-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT 签发方地址，必须与 Token 的 issuer 声明一致。
          issuer-uri: ${BIGSCREEN_AUTH_ISSUER_URI:http://localhost:18443/realms/iam-auth}
          # JWT 验签公钥集合地址。
          jwk-set-uri: ${BIGSCREEN_AUTH_JWK_SET_URI:http://localhost:18443/realms/iam-auth/protocol/openid-connect/certs}
  servlet:
    multipart:
      # BFF 代理上传时允许的单个文件最大大小。
      max-file-size: ${BIGSCREEN_MULTIPART_MAX_FILE_SIZE:20MB}
      # BFF 代理上传时允许的 multipart 请求总大小。
      max-request-size: ${BIGSCREEN_MULTIPART_MAX_REQUEST_SIZE:21MB}
