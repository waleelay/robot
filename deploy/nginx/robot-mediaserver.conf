#user  nobody;
worker_processes  4;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

# ====== 核心：必须包在 http {} 里面 ======
http {
    include       mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $arg_access_token $gateway_authorization {
    default "Bearer $arg_access_token";
    '' $http_authorization;
}

upstream robot_mediaserver_backend {
    server host.docker.internal:8088;
}

upstream robot_bigscreen_bff {
    server host.docker.internal:8090;
}

upstream robot_mediaserver_livekit {
    server host.docker.internal:7880;
}

upstream robot_mediaserver_minio {
    server host.docker.internal:9000;
}

upstream center_api_gateway {
    server 192.168.124.235:8080;
}

# Browser UI, REST APIs, and business WebSocket.
server {
    listen 4443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 21m;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/dist;
    index index.html;

    # MinIO 对象存储 HTTPS 出口：预签名下载 URL（MINIO_DOWNLOAD_PUBLIC_ENDPOINT）指向此地址。
    # 必须保留原始 Host（含端口），与预签名 URL 的 SigV4 签名一致。
    location /robot-media/ {
        proxy_pass http://robot_mediaserver_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api-gw {
        return 308 /api-gw/;
    }

    # /internal/** 仅供服务间内网调用，禁止通过生产浏览器入口或 API Gateway 暴露。
    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /api-gw/internal {
        return 404;
    }

    location ^~ /api-gw/internal/ {
        return 404;
    }

    # HLS uses its own short-lived signed token because native media requests
    # cannot attach the Keycloak Authorization header.
    location ~ ^/api-gw/api/bigscreen/control(/files/[^/]+/hls/.*)$ {
        rewrite ^/api-gw/api/bigscreen/control(.*)$ /api/control$1 break;
        proxy_pass http://robot_bigscreen_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api-gw/ {
        proxy_pass http://center_api_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Authorization $gateway_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://robot_bigscreen_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/control {
        proxy_pass http://robot_bigscreen_bff;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location /ws/media {
        proxy_pass http://robot_bigscreen_bff;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location /ws/bigscreen {
        proxy_pass http://robot_bigscreen_bff;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # LiveKit SDK connects to /livekit/rtc[/v1]; strip the public prefix
    # before forwarding to LiveKit's native /rtc endpoint.
    location ^~ /livekit/ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://robot_mediaserver_livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host:4443$request_uri;
}

}
