log_level: {{LIVEKIT_LOG_LEVEL}}

api_key: {{LIVEKIT_API_KEY}}
api_secret: {{LIVEKIT_API_SECRET}}
ws_url: {{LIVEKIT_INGRESS_WS_URL}}

health_port: 7888
prometheus_port: 7889
rtmp_port: 1935
whip_port: 18081

redis:
  address: {{LIVEKIT_REDIS_ADDRESS}}
  username: "{{LIVEKIT_REDIS_USERNAME}}"
  password: "{{LIVEKIT_REDIS_PASSWORD}}"
  db: {{LIVEKIT_REDIS_DB}}

cpu_cost:
  rtmp_cpu_cost: 2.0
  whip_cpu_cost: 2.0
  whip_bypass_transcoding_cpu_cost: 0.1
  url_cpu_cost: 2.0
