spring:
  application:
    # Spring Boot 应用名称，用于日志、监控和服务标识。
    name: robot-control-service
  datasource:
    # 里程检查点和分钟增量使用与平台一致的 MySQL 数据源。
    url: ${MYSQL_URL:jdbc:mysql://host.docker.internal:3306/robot_media?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # Control 文件代理接口允许的单个上传文件最大大小。
      max-file-size: ${CONTROL_FILE_UPLOAD_MAX_FILE_SIZE:20MB}
      # Control 文件代理接口允许的 multipart 请求总大小。
      max-request-size: ${CONTROL_FILE_UPLOAD_MAX_REQUEST_SIZE:21MB}

server:
  # Control Service HTTP 服务端口，优先使用 CONTROL_SERVER_PORT。
  port: ${CONTROL_SERVER_PORT:${SERVER_PORT:8082}}

control:
  # Media Service 内部接口基础地址。
  media-service-base-url: ${MEDIA_SERVICE_BASE_URL:http://media-service:8088}
  # Management Service 内部接口基础地址。
  management-service-base-url: ${CENTER_MANAGE_BASE_URL:http://host.docker.internal:8866}
  # 设备档案与授权列表缓存 TTL（秒），默认且代码硬上限均为 30 秒。
  device-cache-ttl-seconds: ${MANAGEMENT_DEVICE_CACHE_TTL_SECONDS:30}
  auth:
    # 控制服务默认组织 ID。
    default-org-id: ${CONTROL_DEFAULT_ORG_ID:org001}
    # 生产环境必须由 BFF/API 网关注入可信身份头；本地直连调试如需默认 dev-user，可显式设为 true。
    allow-default-user: ${CONTROL_AUTH_ALLOW_DEFAULT_USER:false}
  mqtt:
    # MQTT Broker 连接地址。
    broker-url: ${MQTT_BROKER_URL:tcp://host.docker.internal:1883}
    # MQTT 用户名，默认空表示不启用账号认证。
    username: ${MQTT_USERNAME:}
    # MQTT 密码，默认空表示不启用账号认证。
    password: ${MQTT_PASSWORD:}
    # Control Service 连接 MQTT 时使用的客户端 ID。
    client-id: ${MQTT_CLIENT_ID:robot-control-service-main}
    # 固定摄像头网关订阅命令时使用的网关 ID。
    fixed-camera-gateway-id: ${FIXED_CAMERA_GATEWAY_ID:default}
    # 是否启用 MQTT 状态订阅与指令下发。
    enabled: ${MQTT_ENABLED:true}
  fixed-camera-health:
    # Gateway 连续多久没有心跳后判为离线。
    gateway-timeout-seconds: ${FIXED_CAMERA_GATEWAY_TIMEOUT_SECONDS:30}
    # 摄像头 RTSP 健康状态最大有效时间，过期后转为 UNKNOWN。
    camera-max-age-seconds: ${FIXED_CAMERA_HEALTH_MAX_AGE_SECONDS:120}
    # 健康状态过期扫描间隔。
    sweep-delay-ms: ${FIXED_CAMERA_HEALTH_SWEEP_DELAY_MS:1000}
  fixed-camera-catalog:
    # BFF 目录租约的最大接受时长；代码硬上限为 300 秒。
    max-lease-seconds: ${FIXED_CAMERA_CATALOG_MAX_LEASE_SECONDS:300}
    # 过期租约清理与空目录收口周期。
    sweep-delay-ms: ${FIXED_CAMERA_CATALOG_SWEEP_DELAY_MS:1000}
    # 仅是内网边界内的调用方标识，不替代后续服务身份认证。
    trusted-caller: ${FIXED_CAMERA_CATALOG_TRUSTED_CALLER:bigscreen-bff}
  center-stomp:
    # 是否连接管理中心 STOMP 端点；任务事实仍以 Management HTTP 查询结果为准。
    enabled: ${CENTER_STOMP_ENABLED:true}
    # 管理中心 STOMP WebSocket 地址。
    websocket-url: ${CENTER_STOMP_WS_URL:ws://host.docker.internal:8867/ws/control}
    # 订阅的管理中心实时事件 Topic。
    topic: ${CENTER_STOMP_TOPIC:/topic/platform/realtime-events}
    # 直接用于 STOMP 连接的 Bearer Token；为空时可通过 token-url 获取。
    access-token: ${CENTER_STOMP_ACCESS_TOKEN:}
    # OAuth2 客户端凭据模式 Token 地址；为空时不自动申请 Token。
    token-url: ${CENTER_STOMP_TOKEN_URL:}
    # 向 token-url 申请访问令牌时使用的 OAuth2 Client ID。
    client-id: ${CENTER_STOMP_CLIENT_ID:}
    # 向 token-url 申请访问令牌时使用的 OAuth2 Client Secret。
    client-secret: ${CENTER_STOMP_CLIENT_SECRET:}
    # STOMP 连接断开后的重连等待时间，单位毫秒。
    reconnect-delay-ms: ${CENTER_STOMP_RECONNECT_DELAY_MS:5000}
  robot:
    # 机器人心跳超时时间，单位秒。
    heartbeat-timeout-seconds: ${ROBOT_HEARTBEAT_TIMEOUT_SECONDS:30}
    # 机器人心跳扫描任务间隔，单位毫秒。
    heartbeat-sweep-delay-ms: ${ROBOT_HEARTBEAT_SWEEP_DELAY_MS:1000}
    # 离线注册表条目保留时间，单位秒；超过该时长未再上报的离线设备从注册表中清理。
    offline-retention-seconds: ${ROBOT_OFFLINE_RETENTION_SECONDS:60}
  mileage:
    # 单次里程增量折算速度超过该值时标记为可疑，不计入大屏统计。
    max-speed-mps: ${MILEAGE_MAX_SPEED_MPS:15}
    # 每台设备累计新增达到该距离后广播一次里程变化事件。
    publish-distance-threshold-meters: ${MILEAGE_PUBLISH_DISTANCE_THRESHOLD_METERS:10}
  session:
    # 中断视频会话自动恢复前的宽限时间，单位秒。
    interrupted-grace-seconds: ${INTERRUPTED_GRACE_SECONDS:15}
    # 空闲视频会话自动释放延迟时间，单位秒。
    idle-release-delay-seconds: ${IDLE_RELEASE_DELAY_SECONDS:600}
    # 观看者或对讲心跳超时时间，单位秒。
    viewer-heartbeat-timeout-seconds: ${VIEWER_HEARTBEAT_TIMEOUT_SECONDS:15}
